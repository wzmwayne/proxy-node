name: 定时抓取清洗节点

on:
  schedule:
    - cron: '0 */4 * * *'        # 每 4 小时(UTC 00/04/08/12/16/20)
  workflow_dispatch:             # 手动触发
    inputs:
      dry_run:
        description: 只生成不提交(调试用)
        type: boolean
        default: false
      test_latency:
        description: 是否测延迟/可达性(false=跳过延迟测试)
        type: boolean
        default: true
      test_bandwidth:
        description: 是否测带宽(20MB 测速,false=跳过测速)
        type: boolean
        default: true
      # 两个都选 false 时:AIO 直接合并(不测延迟/带宽)

# 同一时间只跑一轮,避免两次运行互相 push 冲突
concurrency:
  group: scrape
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  MIHOMO_VERSION: v1.19.9
  MIHOMO_DIR: ${{ github.workspace }}/.cache/geo

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: 缓存 mihomo 内核与地理库
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/mihomo
            .cache/geo
          key: mihomo-${{ env.MIHOMO_VERSION }}-${{ runner.arch }}

      - name: Install mihomo core
        run: bash scripts/install_mihomo.sh

      - name: "确保 20MB 测速文件已发布(release: test)"
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ensure_speedtest_asset.sh

      - name: Scrape yoyapai
        run: python scripts/scraper.py || echo "::warning::yoyapai 抓取失败，跳过该来源"

      - name: Fetch other sources
        run: python scripts/fetch_sources.py || echo "::warning::部分来源下载失败，继续处理已下载的来源"

      - name: 抓取页面型来源（每日文章页解析）
        run: python scripts/scrape_page_sources.py || echo "::warning::页面型来源抓取失败，跳过"

      - name: Sanitize + 内核门禁 + 发布
        run: |
          published=0
          for f in output/*/clash.raw.yaml; do
            [ -e "$f" ] || continue
            src=$(basename "$(dirname "$f")")
            dst="output/$src/clash.yaml"
            args=(--source "$src" --mihomo "$MIHOMO_BIN")
            if [ "${MIHOMO_GATE:-0}" = "1" ]; then
              args+=(--gate --mihomo-dir "$MIHOMO_DIR")
            fi
            if python scripts/sanitize.py "$f" "$dst" "${args[@]}"; then
              published=$((published+1))
              echo "  [OK] $src 已发布"
            else
              echo "::warning::$src 清洗/内核校验失败，保留上一版 $dst"
            fi
          done
          rm -f output/*/clash.raw.yaml
          echo "本轮成功发布来源数: $published"
          if [ "$published" -eq 0 ]; then
            echo "::warning::本轮没有任何来源成功发布（可能全部抓取失败）"
          fi

      - name: 来源清单一致性检查
        run: python scripts/check_sources.py

      - name: 可达性 + 测速 + 生成 AIO
        run: |
          INPUTS=$(find output -mindepth 2 -maxdepth 2 -name clash.yaml ! -path 'output/aio/*' ! -path 'output/aio-all/*' | sort | tr '\n' ' ')
          echo "输入: $INPUTS"
          if [ -z "$INPUTS" ]; then
            echo "::error::没有可用的来源文件"; exit 1
          fi
          TEST_LATENCY="${{ inputs.test_latency }}"
          TEST_BANDWIDTH="${{ inputs.test_bandwidth }}"
          FLAGS=""
          if [ "$TEST_LATENCY" = "false" ] && [ "$TEST_BANDWIDTH" = "false" ]; then
            FLAGS="--merge-only"
            echo "手动参数: 不测延迟/带宽 -> AIO 直接合并"
          else
            if [ "$TEST_LATENCY" = "false" ]; then FLAGS="$FLAGS --no-delay"; fi
            if [ "$TEST_BANDWIDTH" = "false" ]; then FLAGS="$FLAGS --no-speed"; fi
            echo "手动参数: test_latency=${TEST_LATENCY:-true} test_bandwidth=${TEST_BANDWIDTH:-true}"
          fi
          python scripts/test_nodes.py $INPUTS -o output/aio/clash.yaml \
            $FLAGS \
            --mihomo "$MIHOMO_BIN" \
            --concurrency 128 \
            --timeout-ms 4500 \
            --speed-concurrency 128 \
            --speed-timeout 5 \
            --speed-latency-timeout 3 \
            --fast-threshold 2.0 \
            --speed-bytes 20000000 \
            || echo "::warning::AIO 生成失败（节点测试异常），保留上一版"

      - name: 生成 AIO 不精选(直接合并)
        run: |
          INPUTS=$(find output -mindepth 2 -maxdepth 2 -name clash.yaml ! -path 'output/aio/*' ! -path 'output/aio-all/*' | sort | tr '\n' ' ')
          echo "输入: $INPUTS"
          if [ -z "$INPUTS" ]; then
            echo "::error::没有可用的来源文件"; exit 1
          fi
          python scripts/test_nodes.py $INPUTS -o output/aio-all/clash.yaml --merge-only \
            || echo "::warning::AIO 不精选生成失败，保留上一版"

      - name: 校验 AIO（精选 + 不精选）
        run: |
          if [ "${MIHOMO_GATE:-0}" = "1" ]; then
            for f in output/aio/clash.yaml output/aio-all/clash.yaml; do
              [ -f "$f" ] || { echo "::warning::$f 不存在，跳过"; continue; }
              "$MIHOMO_BIN" -t -d "$MIHOMO_DIR" -f "$f" \
                && echo "[OK] $f 内核校验通过" \
                || { echo "::error::$f 未通过内核校验"; exit 1; }
            done
          else
            echo "::warning::跳过 AIO 内核校验（地理库不可用）"
          fi

      - name: 结果汇总
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import glob
          import yaml

          print("## 本轮产物\n")
          print("| 文件 | 节点数 |")
          print("| --- | --- |")
          for f in sorted(glob.glob("output/*/clash.yaml")):
              try:
                  d = yaml.safe_load(open(f, encoding="utf-8")) or {}
                  print(f"| `{f}` | {len(d.get('proxies') or [])} |")
              except Exception as e:
                  print(f"| `{f}` | 解析失败: {e} |")
          PY

      - name: Commit and push
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run != true }}
        run: |
          git config user.name "proxy-node-bot"
          git config user.email "bot@proxy-node.dev"
          git add -A output/ latest_urls.json
          if git diff --cached --quiet; then
            echo "没有需要提交的变更"
            exit 0
          fi
          git diff --cached --stat | tail -5
          git commit -m "update: $(TZ=Asia/Shanghai date +%Y-%m-%d) 节点订阅"
          # 订阅产物是每次运行重新生成的,远端若在本次运行期间也提交过,
          # 合并时一律保留"本轮生成"的内容(生成物没有合并的意义)。
          for i in 1 2 3; do
            git fetch origin "${GITHUB_REF_NAME}"
            if git rebase -X theirs "origin/${GITHUB_REF_NAME}"; then
              if git push origin "HEAD:${GITHUB_REF_NAME}"; then
                echo "推送成功"
                exit 0
              fi
            else
              git rebase --abort || true
              echo "::warning::远端与本地都改过生成物,改用 merge 保留本轮产物"
              if git merge -X ours --no-edit "origin/${GITHUB_REF_NAME}" \
                 && git push origin "HEAD:${GITHUB_REF_NAME}"; then
                echo "推送成功(merge)"
                exit 0
              fi
            fi
            echo "::warning::第 $i 次推送失败，5 秒后重试"
            sleep 5
          done
          echo "::error::推送失败"
          exit 1
